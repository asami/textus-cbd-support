expose:
  textus-cbd-support.cbd-catalog-admin.refresh-catalog: protected
  textus-cbd-support.cbd-retrieval.search-components: public
form:
  textus-cbd-support.cbd-catalog-admin.refresh-catalog:
    enabled: true
    stayOnError: true
    controls:
      sourceId:
        type: text
  textus-cbd-support.cbd-retrieval.search-components:
    enabled: true
    successRedirect: /web/${component}/admin/entities/component-reference
    stayOnError: true
  textus-cbd-support.cbd-retrieval.get-review-run:
    enabled: true
    access: authenticated
    stayOnError: true
  textus-cbd-support.cbd-retrieval.get-review-summary:
    enabled: true
    access: authenticated
    stayOnError: true
  textus-cbd-support.cbd-retrieval.get-review-report:
    enabled: true
    access: authenticated
    stayOnError: true
  textus-cbd-support.cbd-retrieval.list-review-findings:
    enabled: true
    access: authenticated
    stayOnError: true
  textus-cbd-support.cbd-retrieval.list-review-assurances:
    enabled: true
    access: authenticated
    stayOnError: true
  textus-cbd-support.cbd-retrieval.get-review-views:
    enabled: true
    access: authenticated
    stayOnError: true
  textus-cbd-support.cbd-review-admin.get-review-dashboard:
    enabled: true
    access: authenticated
    stayOnError: true
    controls:
      reportId:
        type: text
  textus-cbd-support.cbd-review-admin.get-review-diagnosis:
    enabled: true
    access: authenticated
    stayOnError: true
    controls:
      reportId:
        type: text
      itemKind:
        type: select
        values:
          - observation
          - capability
      itemId:
        type: text
admin:
  entity.component-reference:
    totalCount: optional

expose:
  textus-cbd-support.cbd-catalog-admin.refresh-catalog: protected
  textus-cbd-support.cbd-retrieval.search-components: public
form:
  textus-cbd-support.cbd-catalog-admin.refresh-catalog:
    enabled: true
    stayOnError: true
    controls:
      sourceId:
        type: text
  textus-cbd-support.cbd-retrieval.search-components:
    enabled: true
    successRedirect: /web/${component}/admin/entities/component-reference
    stayOnError: true
  textus-cbd-support.cbd-retrieval.get-review-run:
    enabled: true
    access: authenticated
    stayOnError: true
  textus-cbd-support.cbd-retrieval.get-review-summary:
    enabled: true
    access: authenticated
    stayOnError: true
  textus-cbd-support.cbd-retrieval.get-review-report:
    enabled: true
    access: authenticated
    stayOnError: true
  textus-cbd-support.cbd-retrieval.list-review-findings:
    enabled: true
    access: authenticated
    stayOnError: true
  textus-cbd-support.cbd-retrieval.list-review-assurances:
    enabled: true
    access: authenticated
    stayOnError: true
  textus-cbd-support.cbd-retrieval.get-review-views:
    enabled: true
    access: authenticated
    stayOnError: true
  textus-cbd-support.cbd-review-admin.get-review-dashboard:
    enabled: true
    access: authenticated
    stayOnError: true
    controls:
      reportId:
        type: text
  textus-cbd-support.cbd-review-admin.get-review-diagnosis:
    enabled: true
    access: authenticated
    stayOnError: true
    controls:
      reportId:
        type: text
      itemKind:
        type: select
        values:
          - observation
          - capability
      itemId:
        type: text
  textus-cbd-support.cbd-retrieval.get-capability-overview:
    enabled: true
    access: authenticated
    stayOnError: true
    resultTemplate: |
      <article>
        <textus-error-panel source="error"></textus-error-panel>
        <textus-html-field source="result.body" field="html"></textus-html-field>
      </article>
  textus-cbd-support.cbd-retrieval.get-capability:
    enabled: true
    access: authenticated
    stayOnError: true
    resultTemplate: |
      <article>
        <textus-error-panel source="error"></textus-error-panel>
        <textus-html-field source="result.body" field="html"></textus-html-field>
      </article>
  textus-cbd-support.cbd-retrieval.find-providers:
    enabled: true
    access: authenticated
    stayOnError: true
    resultTemplate: |
      <article>
        <textus-error-panel source="error"></textus-error-panel>
        <textus-html-field source="result.body" field="html"></textus-html-field>
      </article>
  textus-cbd-support.cbd-retrieval.find-requirements:
    enabled: true
    access: authenticated
    stayOnError: true
    resultTemplate: |
      <article>
        <textus-error-panel source="error"></textus-error-panel>
        <textus-html-field source="result.body" field="html"></textus-html-field>
      </article>
  textus-cbd-support.cbd-retrieval.trace-component-usage-capability:
    enabled: true
    access: authenticated
    stayOnError: true
    resultTemplate: |
      <article>
        <textus-error-panel source="error"></textus-error-panel>
        <textus-html-field source="result.body" field="html"></textus-html-field>
      </article>
  textus-cbd-support.cbd-retrieval.trace-use-case-demand:
    enabled: true
    access: authenticated
    stayOnError: true
    resultTemplate: |
      <article>
        <textus-error-panel source="error"></textus-error-panel>
        <textus-html-field source="result.body" field="html"></textus-html-field>
      </article>
  textus-cbd-support.cbd-retrieval.diagnose-capability-demand:
    enabled: true
    access: authenticated
    stayOnError: true
    resultTemplate: |
      <article>
        <textus-error-panel source="error"></textus-error-panel>
        <textus-html-field source="result.body" field="html"></textus-html-field>
      </article>
admin:
  entity.component-reference:
    totalCount: optional

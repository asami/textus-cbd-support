expose:
  textus-cbd-support.cbd-retrieval.refresh-catalog: protected
  textus-cbd-support.cbd-retrieval.search-components: public
form:
  textus-cbd-support.cbd-retrieval.refresh-catalog:
    enabled: true
    successRedirect: /web/${component}/admin/entities/component-reference/${result.id}
    stayOnError: true
    controls:
      description:
        type: textarea
  textus-cbd-support.cbd-retrieval.search-components:
    enabled: true
    successRedirect: /web/${component}/admin/entities/component-reference
    stayOnError: true
admin:
  entity.component-reference:
    totalCount: optional

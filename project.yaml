project:
  namespace: "org.simplemodeling.textus"
  id: "CbdSupport"
  title: "Textus CBD Support"
  kind: car
  component:
    displayName: "Textus CBD Support"
    version: "0.1.0-SNAPSHOT"
    config:
      textus.server.default-port: "18013"
  summary: "Provides catalog-backed component discovery and usage guidance for Component-Based Development."
  description: "Aggregates the simplemodeling.org component catalog and configured catalogs, then exposes evidence-bearing CAR/SAR discovery and usage information through MCP-ready operations."

build:
  scalaVersion: "3.3.8"
  cozyVersion: "0.3.4-SNAPSHOT"
  dependencies:
    compile:
      - "org.goldenport::goldenport-cncf:0.5.2-SNAPSHOT"
    test:
      - "org.scalatest::scalatest:3.2.19"
      - "org.scalatestplus::scalacheck-1-18:3.2.19.0"

publication:
  source_manifest:
    enabled: false

packaging:
  kind: car
  car:
    manifest_metadata:
      boundedContext: "component-development"
      domain: "cbd"
    runtime:
      cncf:
        minimum: "0.5.2-SNAPSHOT"
        excluded: []
        tested:
          - "0.5.2-SNAPSHOT"

warehouse:
  repository_artifacts:
    include:
      - car
    modules:
      - "textus-cbd-support"
